name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - run: uv run ruff check packages tests scripts
      - run: uv run ruff format --check packages tests scripts
      - run: uv run pytest -q
        env:
          PYTHONPATH: packages/complibot/src
          DATABASE_URL: sqlite+aiosqlite:///./.data/complibot.db
          INLINE_WORKER: "true"

  packs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - run: uv run python scripts/packs_validate.py
        env:
          PYTHONPATH: packages/complibot/src

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - run: pnpm typecheck
        working-directory: apps/web
      - run: pnpm lint
        working-directory: apps/web
