# Production-style stack for a single host (EC2 demo). Copy .env.example → .env and fill prod values.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: complibot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-complibot}
      POSTGRES_DB: complibot
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U complibot"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uvicorn", "apps.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://complibot:${POSTGRES_PASSWORD:-complibot}@postgres:5432/complibot?ssl=disable
      AWS_ENDPOINT_URL: ""
      INLINE_WORKER: "false"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "apps/worker/main.py"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://complibot:${POSTGRES_PASSWORD:-complibot}@postgres:5432/complibot?ssl=disable
      AWS_ENDPOINT_URL: ""
      INLINE_WORKER: "false"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
